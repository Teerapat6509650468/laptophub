<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Data View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .customer-row {
            transition: background-color 0.3s;
        }
        .customer-row:hover {
            background-color: #f8f9fa;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .error-message {
            display: none;
            color: #dc3545;
            padding: 20px;
            text-align: center;
        }
        .add-customer-form {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Customer Information</h1>

        <!-- Add Customer Form -->
        <div class="card mb-4" id="addCustomerCard" style="display: none;">
            <div class="card-header bg-success text-white">
                <h3 class="card-title mb-0">Add New Customer</h3>
            </div>
            <div class="card-body">
                <form id="customerForm" class="add-customer-form">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="tel" class="form-control" id="phone" required>
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <input type="text" class="form-control" id="address" required>
                    </div>
                    <button type="submit" class="btn btn-success">Add Customer</button>
                </form>
            </div>
        </div>

        <!-- Loading indicator -->
        <div id="loading" class="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Fetching customer information...</p>
        </div>

        <!-- Error message -->
        <div id="error" class="error-message">
            <div class="alert alert-danger">
                Failed to fetch customer information. Please try again later.
            </div>
        </div>

        <div class="card" id="customerCard" style="display: none;">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h3 class="card-title mb-0">Customer List</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Address</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody">
                            <!-- Customer data will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let additionEnabled = false;

        // Check if customer addition is enabled
        async function checkAdditionStatus() {
            try {
                const response = await fetch('http://localhost:8081/customers/addition-status');
                if (response.ok) {
                    additionEnabled = await response.json();
                    document.getElementById('addCustomerCard').style.display = additionEnabled ? 'block' : 'none';
                }
            } catch (error) {
                console.error('Error checking addition status:', error);
            }
        }

        // Initialize form submission
        document.getElementById('customerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!additionEnabled) {
                alert('Customer addition is not enabled yet. Please wait for the Laptop Customer to enable it.');
                return;
            }

            const customerData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value
            };

            try {
                const response = await fetch('http://localhost:8081/customers/addCustomer', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(customerData)
                });

                if (!response.ok) {
                    throw new Error('Failed to add customer');
                }

                alert('Customer added successfully!');
                document.getElementById('customerForm').reset();
                checkAndFetchCustomers(); // Refresh the customer list
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to add customer');
            }
        });

        // Add status check to page load
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('fetch') === 'true') {
                checkAdditionStatus();
                checkAndFetchCustomers();
            }
        });

        // Check localStorage and URL parameters on page load
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const shouldFetch = urlParams.get('fetch') === 'true';
            
            if (shouldFetch) {
                checkAndFetchCustomers();
            } else {
                document.getElementById('customerCard').style.display = 'none';
            }
        };

        async function checkAndFetchCustomers() {
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const customerCard = document.getElementById('customerCard');

            try {
                loadingDiv.style.display = 'block';
                errorDiv.style.display = 'none';
                customerCard.style.display = 'block'; // Always show the card

                // Check if data has been requested
                const statusResponse = await fetch('http://localhost:8081/customers/status');
                const dataRequested = await statusResponse.json();

                if (!dataRequested) {
                    errorDiv.innerHTML = '<div class="alert alert-warning">No customers available. Please make sure to click "Request All Customer Information" in the Laptop Customer first.</div>';
                    errorDiv.style.display = 'block';
                    updateTable([]); // Show empty table
                    return;
                }

                // If data has been requested, fetch the customers
                const response = await fetch('http://localhost:8080/client/customers');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const customers = await response.json();
                if (customers.length === 0) {
                    errorDiv.innerHTML = '<div class="alert alert-warning">No customers found in the system.</div>';
                    errorDiv.style.display = 'block';
                }
                updateTable(customers);
            } catch (error) {
                console.error('Error:', error);
                errorDiv.innerHTML = '<div class="alert alert-danger">Failed to fetch customer information. Please try again later.</div>';
                errorDiv.style.display = 'block';
                updateTable([]); // Show empty table on error
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        function updateTable(customers) {
            const tableBody = document.getElementById('customerTableBody');
            tableBody.innerHTML = '';

            customers.forEach(customer => {
                const row = document.createElement('tr');
                row.className = 'customer-row';
                
                row.innerHTML = `
                    <td>${customer.id}</td>
                    <td>${customer.name}</td>
                    <td>${customer.email}</td>
                    <td>${customer.phone}</td>
                    <td>${customer.address}</td>
                `;
                tableBody.appendChild(row);
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
