<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Data View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .customer-row {
            transition: background-color 0.3s;
        }
        .customer-row:hover {
            background-color: #f8f9fa;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .error-message {
            display: none;
            color: #dc3545;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Customer Information</h1>

        <!-- Loading indicator -->
        <div id="loading" class="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Fetching customer information...</p>
        </div>

        <!-- Error message -->
        <div id="error" class="error-message">
            <div class="alert alert-danger">
                Failed to fetch customer information. Please try again later.
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h3 class="card-title mb-0">Customer List</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Address</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody">
                            <!-- Customer data will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchCustomers();
        });

        async function fetchCustomers() {
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const tableBody = document.getElementById('customerTableBody');
            
            try {
                loadingDiv.style.display = 'block';
                errorDiv.style.display = 'none';
                tableBody.innerHTML = '';
                
                const response = await fetch('http://localhost:8080/client/customers');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const customers = await response.json();
                if (customers.length === 0) {
                    errorDiv.innerHTML = '<div class="alert alert-warning">No customers found in the system.</div>';
                    errorDiv.style.display = 'block';
                    return;
                }
                updateTable(customers);
            } catch (error) {
                console.error('Error fetching customers:', error);
                errorDiv.innerHTML = '<div class="alert alert-danger">Failed to fetch customer information. Please try again later.</div>';
                errorDiv.style.display = 'block';
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        function updateTable(customers) {
            const tableBody = document.getElementById('customerTableBody');
            tableBody.innerHTML = '';

            customers.forEach(customer => {
                const row = document.createElement('tr');
                row.className = 'customer-row';
                
                row.innerHTML = `
                    <td>${customer.id}</td>
                    <td>${customer.name}</td>
                    <td>${customer.email}</td>
                    <td>${customer.phone}</td>
                    <td>${customer.address}</td>
                `;
                tableBody.appendChild(row);
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
