<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .center-content {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .btn-group-custom {
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Laptop Customer</h1>
        <div class="text-center mt-4 btn-group-custom d-flex justify-content-center">
            <button id="requestCustomerData" class="btn btn-primary">Request All Customer Information</button>
            <button id="addCustomer" class="btn btn-success">Request Add Customer</button>
            <button id="clientButton" class="btn btn-info text-white">Client</button>
        </div>
    </div>

    <script>
        document.getElementById('clientButton').addEventListener('click', () => {
            window.location.href = 'client.html?fetch=true';
        });

        document.getElementById('requestCustomerData').addEventListener('click', async () => {
            try {
                const response = await fetch('http://localhost:8081/customers');
                if (!response.ok) {
                    throw new Error('Failed to fetch customer data');
                }
                const customers = await response.json();
                alert(`Retrieved information for ${customers.length} customers`);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to fetch customer data');
            }
        });

        document.getElementById('addCustomer').addEventListener('click', async () => {
        // Create alert box with form fields
        const customerForm = `
            Name: <input type="text" id="customerName" class="form-control mb-2">
            Email: <input type="email" id="customerEmail" class="form-control mb-2">
            Phone: <input type="tel" id="customerPhone" class="form-control mb-2">
            Address: <input type="text" id="customerAddress" class="form-control mb-2">
        `;

        // Create custom alert using Bootstrap modal
        const modalHtml = `
            <div class="modal fade" id="customerModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Add New Customer</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            ${customerForm}
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="button" class="btn btn-primary" id="saveCustomer">Save</button>
                        </div>
                    </div>
                </div>
            </div>
        `;

        // Add modal to document
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    
        // Get modal instance
        const modal = new bootstrap.Modal(document.getElementById('customerModal'));
        modal.show();

        // Handle save button click
        document.getElementById('saveCustomer').addEventListener('click', async () => {
            const name = document.getElementById('customerName').value;
            const email = document.getElementById('customerEmail').value;
            const phone = document.getElementById('customerPhone').value;
            const address = document.getElementById('customerAddress').value;

            // Validate all fields are filled
            if (!name || !email || !phone || !address) {
                alert('Please fill in all fields');
                return;
            }

            const customerData = {
                name: name,
                email: email,
                phone: phone,
                address: address
            };

            try {
                const response = await fetch('http://localhost:8081/customers/addCustomer', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(customerData)
                });

                if (!response.ok) {
                    throw new Error('Failed to add customer');
                }

                const result = await response.json();
                alert('Customer added successfully!');
                modal.hide();
                
                // Remove modal from DOM after hiding
                document.getElementById('customerModal').addEventListener('hidden.bs.modal', function () {
                    this.remove();
                });
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to add customer');
            }
        });

        // Clean up modal when closed
        document.getElementById('customerModal').addEventListener('hidden.bs.modal', function () {
            this.remove();
        });
});
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
