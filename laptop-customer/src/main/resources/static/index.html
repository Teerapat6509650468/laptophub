<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Laptop Customer</h1>
        <div class="mt-4">
            <button id="fetchLaptops" class="btn btn-primary">Fetch All Laptops</button>
        </div>
        <div class="mt-4">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Brand</th>
                        <th>Model</th>
                        <th>Processor</th>
                        <th>RAM</th>
                        <th>Storage</th>
                        <th>Price</th>
                        <th>Reserved</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="laptopTableBody">
                    <!-- Laptops will be dynamically added here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const baseUrl = "http://localhost:8081/client/laptops";

        // Fetch all laptops
        document.getElementById('fetchLaptops').addEventListener('click', async () => {
            try {
                const response = await axios.get(baseUrl);
                const laptops = response.data;
                const tableBody = document.getElementById('laptopTableBody');
                tableBody.innerHTML = ''; // Clear existing rows

                laptops.forEach(laptop => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${laptop.id}</td>
                        <td>${laptop.brand}</td>
                        <td>${laptop.model}</td>
                        <td>${laptop.processor}</td>
                        <td>${laptop.ram} GB</td>
                        <td>${laptop.storage} GB</td>
                        <td>$${laptop.price}</td>
                        <td>${laptop.reserved ? 'Yes' : 'No'}</td>
                        <td>
                            <button class="btn btn-success reserve-btn" data-id="${laptop.id}" ${laptop.reserved ? 'disabled' : ''}>
                                Reserve
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

                // Add event listeners to reserve buttons
                document.querySelectorAll('.reserve-btn').forEach(button => {
                    button.addEventListener('click', async (event) => {
                        const laptopId = event.target.getAttribute('data-id');
                        await reserveLaptop(laptopId);
                    });
                });
            } catch (error) {
                console.error('Error fetching laptops:', error);
                alert('Failed to fetch laptops. Please try again.');
            }
        });

        // Reserve a laptop
        async function reserveLaptop(id) {
            try {
                const response = await axios.post(`${baseUrl}/${id}/reserve`);
                alert(response.data);
                document.getElementById('fetchLaptops').click(); // Refresh the table
            } catch (error) {
                console.error('Error reserving laptop:', error);
                alert('Failed to reserve laptop. Please try again.');
            }
        }
    </script>
</body>
</html>
