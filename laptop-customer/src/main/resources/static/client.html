<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Store Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .reserved {
            background-color: #ffebee;
        }
        .status-yes {
            color: #28a745;
            font-weight: bold;
        }
        .status-no {
            color: #dc3545;
            font-weight: bold;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .error-message {
            display: none;
            color: #dc3545;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Laptop Store Client View</h1>
        
        <!-- Loading indicator -->
        <div id="loading" class="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Fetching laptop information...</p>
        </div>

        <!-- Error message -->
        <div id="error" class="error-message">
            <div class="alert alert-danger">
                Failed to fetch laptop information. Please try again later.
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="card-title mb-0">Available Laptops</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Brand</th>
                                <th>Model</th>
                                <th>Processor</th>
                                <th>RAM (GB)</th>
                                <th>Storage (GB)</th>
                                <th>Price ($)</th>
                                <th>Available</th>
                            </tr>
                        </thead>
                        <tbody id="laptopTableBody">
                            <!-- Laptop data will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Get the trigger parameter from URL
            const params = new URLSearchParams(window.location.search);
            if (params.get('fetch') === 'true') {
                fetchLaptops();
            }
        });

        async function fetchLaptops() {
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            
            try {
                loadingDiv.style.display = 'block';
                errorDiv.style.display = 'none';
                
                const response = await fetch('http://localhost:8081/client/laptops');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const laptops = await response.json();
                if (laptops.length === 0) {
                    errorDiv.innerHTML = '<div class="alert alert-warning">No laptops available. Please make sure to click "Request All Laptop Information" in the Laptop Store first.</div>';
                    errorDiv.style.display = 'block';
                    return;
                }
                updateTable(laptops);
            } catch (error) {
                console.error('Error fetching laptops:', error);
                errorDiv.innerHTML = '<div class="alert alert-danger">Failed to fetch laptop information. Please try again later.</div>';
                errorDiv.style.display = 'block';
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        function updateTable(laptops) {
            const tableBody = document.getElementById('laptopTableBody');
            tableBody.innerHTML = '';

            laptops.forEach(laptop => {
                const row = document.createElement('tr');
                row.className = laptop.reserved ? 'reserved' : '';
                
                row.innerHTML = `
                    <td>${laptop.id}</td>
                    <td>${laptop.brand}</td>
                    <td>${laptop.model}</td>
                    <td>${laptop.processor}</td>
                    <td>${laptop.ram}</td>
                    <td>${laptop.storage}</td>
                    <td>${laptop.price.toFixed(2)}</td>
                    <td class="${laptop.reserved ? 'status-no' : 'status-yes'}">
                        ${laptop.reserved ? 'No' : 'Yes'}
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
