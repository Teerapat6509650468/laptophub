<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Store Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .reserved {
            background-color: #ffebee;
        }
        .status-yes {
            color: #28a745;
            font-weight: bold;
        }
        .status-no {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Laptop Store Client View</h1>
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="card-title mb-0">Available Laptops</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Brand</th>
                                <th>Model</th>
                                <th>Processor</th>
                                <th>RAM (GB)</th>
                                <th>Storage (GB)</th>
                                <th>Price ($)</th>
                                <th>Available</th>
                            </tr>
                        </thead>
                        <tbody id="laptopTableBody">
                            <!-- Laptop data will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Function to refresh laptop data every 5 seconds
        function startAutoRefresh() {
            fetchLaptops(); // Initial fetch
            setInterval(fetchLaptops, 5000); // Refresh every 5 seconds
        }

        // Fetch laptops from the server
        async function fetchLaptops() {
            try {
                const response = await fetch('http://localhost:8081/client/laptops');
                const laptops = await response.json();
                updateTable(laptops);
            } catch (error) {
                console.error('Error fetching laptops:', error);
            }
        }

        // Update the table with laptop data
        function updateTable(laptops) {
            const tableBody = document.getElementById('laptopTableBody');
            tableBody.innerHTML = '';

            laptops.forEach(laptop => {
                const row = document.createElement('tr');
                row.className = laptop.reserved ? 'reserved' : '';
                
                row.innerHTML = `
                    <td>${laptop.id}</td>
                    <td>${laptop.brand}</td>
                    <td>${laptop.model}</td>
                    <td>${laptop.processor}</td>
                    <td>${laptop.ram}</td>
                    <td>${laptop.storage}</td>
                    <td>${laptop.price.toFixed(2)}</td>
                    <td class="${laptop.reserved ? 'status-no' : 'status-yes'}">
                        ${laptop.reserved ? 'No' : 'Yes'}
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Start the auto-refresh when the page loads
        document.addEventListener('DOMContentLoaded', startAutoRefresh);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
