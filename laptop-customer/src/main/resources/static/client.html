<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Store Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .reserved {
            background-color: #ffebee;
        }
        .status-yes {
            color: #28a745;
            font-weight: bold;
        }
        .status-no {
            color: #dc3545;
            font-weight: bold;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .error-message {
            display: none;
            color: #dc3545;
            padding: 20px;
            text-align: center;
        }
        .reserve-disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .action-buttons {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Laptop Store Client View</h1>
        
        <!-- Navigation and Action Buttons -->
        <div class="action-buttons d-flex justify-content-between mb-4">
            <a href="index.html" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Back to Laptop Customer
            </a>
            <button id="refreshButton" class="btn btn-primary">
                <i class="bi bi-arrow-clockwise"></i> Refresh Data
            </button>
        </div>
        
        <!-- Loading indicator -->
        <div id="loading" class="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Fetching laptop information...</p>
        </div>

        <!-- Error message -->
        <div id="error" class="error-message">
            <div class="alert alert-danger">
                Failed to fetch laptop information. Please try again later.
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="card-title mb-0">Available Laptops</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Brand</th>
                                <th>Model</th>
                                <th>Processor</th>
                                <th>RAM (GB)</th>
                                <th>Storage (GB)</th>
                                <th>Price ($)</th>
                                <th>Available</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="laptopTableBody">
                            <!-- Laptop data will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let reservationEnabled = false;

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('fetch') === 'true') {
                checkReservationStatus();
                fetchLaptops();
            }
            
            // Add event listener for refresh button
            document.getElementById('refreshButton').addEventListener('click', () => {
                checkReservationStatus();
                fetchLaptops();
            });
        });

        async function checkReservationStatus() {
            try {
                const response = await fetch('http://localhost:8080/laptops/reservation-status');
                if (response.ok) {
                    reservationEnabled = await response.json();
                }
            } catch (error) {
                console.error('Error checking reservation status:', error);
            }
        }

        async function reserveLaptop(id) {
            if (!reservationEnabled) {
                alert('Reservations are not enabled yet. Please wait for the store to enable reservations.');
                return;
            }

            try {
                const response = await fetch(`http://localhost:8081/client/laptops/${id}/reserve`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok) {
                    throw new Error('Failed to reserve laptop');
                }
                alert('Laptop reserved successfully!');
                fetchLaptops(); // Refresh the list
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to reserve laptop');
            }
        }

        async function fetchLaptops() {
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            
            try {
                await checkReservationStatus();
                loadingDiv.style.display = 'block';
                errorDiv.style.display = 'none';
                
                const response = await fetch('http://localhost:8081/client/laptops');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const laptops = await response.json();
                if (laptops.length === 0) {
                    errorDiv.innerHTML = '<div class="alert alert-warning">No laptops available. Please make sure to click "Request All Laptop Information" in the Laptop Store first.</div>';
                    errorDiv.style.display = 'block';
                    return;
                }
                updateTable(laptops);
            } catch (error) {
                console.error('Error fetching laptops:', error);
                errorDiv.innerHTML = '<div class="alert alert-danger">Failed to fetch laptop information. Please try again later.</div>';
                errorDiv.style.display = 'block';
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        function updateTable(laptops) {
            const tableBody = document.getElementById('laptopTableBody');
            tableBody.innerHTML = '';

            laptops.forEach(laptop => {
                const row = document.createElement('tr');
                row.className = laptop.reserved ? 'reserved' : '';
                
                const reserveButtonClass = !reservationEnabled ? 'btn-secondary reserve-disabled' : 'btn-primary';
                const reserveButtonDisabled = !reservationEnabled || laptop.reserved;
                
                row.innerHTML = `
                    <td>${laptop.id}</td>
                    <td>${laptop.brand}</td>
                    <td>${laptop.model}</td>
                    <td>${laptop.processor}</td>
                    <td>${laptop.ram}</td>
                    <td>${laptop.storage}</td>
                    <td>${laptop.price.toFixed(2)}</td>
                    <td class="${laptop.reserved ? 'status-no' : 'status-yes'}">
                        ${laptop.reserved ? 'No' : 'Yes'}
                    </td>
                    <td>
                        <button class="btn btn-sm ${reserveButtonClass}" 
                                onclick="reserveLaptop(${laptop.id})"
                                ${reserveButtonDisabled ? 'disabled' : ''}>
                            ${laptop.reserved ? 'Reserved' : 'Reserve'}
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
